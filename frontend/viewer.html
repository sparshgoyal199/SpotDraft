<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexora — Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="viewer">
  <header class="app-header">
    <div class="header-actions">
      <a class="btn btn-ghost btn-small" href="/dashboard">Library</a>
      <strong id="filename">Loading…</strong>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-small" id="share-btn" type="button">Copy share link</button>
    </div>
  </header>
  <div class="summary-bar" id="summary">Generating layout…</div>
  <div class="viewer-body">
    <section class="pdf-frame">
      <iframe id="pdf-frame" title="PDF preview"></iframe>
    </section>
    <aside class="side-panel">
      <div class="side-tabs">
        <button class="side-tab active" type="button" data-tab="chat">Ask the PDF</button>
        <button class="side-tab" type="button" data-tab="comments">Comments</button>
      </div>

      <section class="side-content active" data-panel="chat">
        <div class="chat-shell">
          <div class="chat-header">
            <div>
              <div class="chat-title">Lexora AI</div>
              <div class="chat-subtitle">Grounded answers from this document</div>
            </div>
          </div>
          <div class="chat-messages" id="chat"></div>
          <div class="chat-composer">
            <textarea id="chat-input" rows="1" placeholder="Ask about clauses, findings, definitions…"></textarea>
            <button class="chat-send-btn" id="chat-btn" type="button" aria-label="Send message">↑</button>
          </div>
        </div>
      </section>

      <section class="side-content" data-panel="comments">
        <div class="comments-shell">
          <div class="comments-list" id="comments"></div>
          <div class="comment-composer">
            <input id="comment-input" type="text" placeholder="Leave a note for collaborators" />
            <button class="btn btn-primary btn-small" id="comment-btn" type="button">Post</button>
          </div>
        </div>
      </section>
    </aside>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
